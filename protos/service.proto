syntax = "proto3";

package yolo;

service YoloService {
  rpc Detect (ImageFrame) returns (DetectionResponse) {}
}

message ImageFrame {
  bytes data = 1;
  int32 width = 2;
  int32 height = 3;
  int32 channels = 4;
}

message Detection {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  float confidence = 5;
  int32 class_id = 6;
  string class_name = 7;
}

message DetectionResponse {
  repeated Detection detections = 1;
}
